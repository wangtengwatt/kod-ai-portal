name: kod-ai-portal

# 仅部署前端 + 后端两个容器；MySQL / Redis 使用已有的外部实例（通过 .env 配置）。

services:
  # 后端 Spring Boot
  backend:
    build: ./backend
    image: kod-backend:latest
    container_name: kod-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 外部已有的 MySQL
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kod}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 外部已有的 Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # KAI 统一身份（OIDC + PKCE）
      KOD_IDENTITY_ENABLED: ${KOD_IDENTITY_ENABLED:-true}
      KOD_IDENTITY_CLIENT_ID: ${KOD_IDENTITY_CLIENT_ID:-OlpPQvTEyVkS4xf74mLT6OW5AI2jvh4r}
      KOD_IDENTITY_IOS_CLIENT_ID: ${KOD_IDENTITY_IOS_CLIENT_ID}
      KOD_IDENTITY_ISSUER: ${KOD_IDENTITY_ISSUER:-https://auth.kai.com/api/auth}
      KOD_IDENTITY_AUTHORIZATION_ENDPOINT: ${KOD_IDENTITY_AUTHORIZATION_ENDPOINT:-https://auth.kai.com/api/auth/oauth2/authorize}
      KOD_IDENTITY_TOKEN_ENDPOINT: ${KOD_IDENTITY_TOKEN_ENDPOINT:-https://auth.kai.com/api/auth/oauth2/token}
      KOD_IDENTITY_USERINFO_URI: ${KOD_IDENTITY_USERINFO_URI:-https://auth.kai.com/api/auth/oauth2/userinfo}
      KOD_IDENTITY_REDIRECT_URI: ${KOD_IDENTITY_REDIRECT_URI:-http://127.0.0.1:1456/auth/callback}
      KOD_IDENTITY_SCOPE: ${KOD_IDENTITY_SCOPE:-openid profile email}
      KOD_IDENTITY_SCHEMA_INIT_ENABLED: ${KOD_IDENTITY_SCHEMA_INIT_ENABLED:-true}
      # Cross-device state, encrypted provider secrets, and private image/video objects
      KOD_SYNC_ENABLED: ${KOD_SYNC_ENABLED:-true}
      KOD_SYNC_VAULT_MASTER_KEY: ${KOD_SYNC_VAULT_MASTER_KEY}
      KOD_MEDIA_STORAGE_ENABLED: ${KOD_MEDIA_STORAGE_ENABLED:-true}
      KOD_MEDIA_STORAGE_ENDPOINT: ${KOD_MEDIA_STORAGE_ENDPOINT:-}
      KOD_MEDIA_STORAGE_REGION: ${KOD_MEDIA_STORAGE_REGION:-us-east-1}
      KOD_MEDIA_STORAGE_BUCKET: ${KOD_MEDIA_STORAGE_BUCKET}
      KOD_MEDIA_STORAGE_ACCESS_KEY: ${KOD_MEDIA_STORAGE_ACCESS_KEY:-}
      KOD_MEDIA_STORAGE_SECRET_KEY: ${KOD_MEDIA_STORAGE_SECRET_KEY:-}
      KOD_MEDIA_STORAGE_PATH_STYLE_ACCESS: ${KOD_MEDIA_STORAGE_PATH_STYLE_ACCESS:-false}
      KOD_MEDIA_STORAGE_SERVER_SIDE_ENCRYPTION: ${KOD_MEDIA_STORAGE_SERVER_SIDE_ENCRYPTION:-AES256}
      KOD_MEDIA_STORAGE_MAX_OBJECT_BYTES: ${KOD_MEDIA_STORAGE_MAX_OBJECT_BYTES:-134217728}
      KOD_MEDIA_STORAGE_MAX_USER_BYTES: ${KOD_MEDIA_STORAGE_MAX_USER_BYTES:-5368709120}
      # Cloud sandbox worker authentication
      KOD_CLOUD_SANDBOX_ENABLED: ${KOD_CLOUD_SANDBOX_ENABLED:-true}
      KOD_WORKER_BOOTSTRAP_SECRET: ${KOD_WORKER_BOOTSTRAP_SECRET}
      KOD_WORKER_HEARTBEAT_TTL_MILLIS: ${KOD_WORKER_HEARTBEAT_TTL_MILLIS:-60000}
      KOD_WORKER_RECOVERY_INTERVAL_MILLIS: ${KOD_WORKER_RECOVERY_INTERVAL_MILLIS:-30000}
      # App Store digital rights; configure consumable credit mappings in protected Spring config.
      KOD_STOREKIT_ENABLED: ${KOD_STOREKIT_ENABLED:-true}
      KOD_STOREKIT_BUNDLE_ID: ${KOD_STOREKIT_BUNDLE_ID:-com.kai.kod}
      KOD_STOREKIT_APP_APPLE_ID: ${KOD_STOREKIT_APP_APPLE_ID}
      KOD_STOREKIT_ROOT_CERTIFICATE_PATHS: ${KOD_STOREKIT_ROOT_CERTIFICATE_PATHS:-/run/secrets/apple/AppleRootCA-G3.cer}
      KOD_STOREKIT_SUBSCRIPTION_PRODUCT_IDS: ${KOD_STOREKIT_SUBSCRIPTION_PRODUCT_IDS}
      KOD_STOREKIT_CONSUMABLE_CREDITS: ${KOD_STOREKIT_CONSUMABLE_CREDITS}
      KOD_STOREKIT_ALLOW_XCODE_TRANSACTIONS: "false"
      # KOD 算力中心
      KOD_COMPUTE_ADMIN_EMAILS: ${KOD_COMPUTE_ADMIN_EMAILS:-}
      KOD_COMPUTE_KAI_STATION_DOMAINS: ${KOD_COMPUTE_KAI_STATION_DOMAINS:-kai.com}
      KOD_CARD_HOUR_CNY_RATE: ${KOD_CARD_HOUR_CNY_RATE:-1.002}
      KOD_TRANSFER_REVIEW_THRESHOLD_CARD_HOURS: ${KOD_TRANSFER_REVIEW_THRESHOLD_CARD_HOURS:-1000.000}
      KOD_COMPUTE_DELIVERY_SECRET: ${KOD_COMPUTE_DELIVERY_SECRET:-}
      KOD_COMPUTE_SCHEMA_INIT_ENABLED: ${KOD_COMPUTE_SCHEMA_INIT_ENABLED:-false}
      KOD_COMPUTE_TEST_IDENTITY_ENABLED: ${KOD_COMPUTE_TEST_IDENTITY_ENABLED:-false}
      KOD_COMPUTE_PRIVATE_STORAGE_DIRECTORY: ${KOD_COMPUTE_PRIVATE_STORAGE_DIRECTORY:-/var/lib/kod/compute-private}
      KOD_COMPUTE_PROXY_BASE_URL: ${KOD_COMPUTE_PROXY_BASE_URL:-https://kod.kai.com/api/compute/proxy/v1}
      VAST_API_KEY: ${VAST_API_KEY:-}
      VAST_SEARCH_URL: ${VAST_SEARCH_URL:-https://console.vast.ai/api/v0/bundles/}
      AKAMAI_GPU_PRODUCT_URL: ${AKAMAI_GPU_PRODUCT_URL:-https://www.akamai.com/zh/products/gpu/nvidia}
      AKAMAI_GPU_TYPES_URL: ${AKAMAI_GPU_TYPES_URL:-https://api.linode.com/v4/linode/types?page_size=500}
      KOD_USD_CNY_RATE: ${KOD_USD_CNY_RATE:-7.2000}
      KOD_MARKET_PRICE_ENABLED: ${KOD_MARKET_PRICE_ENABLED:-true}
      KOD_MARKET_PRICE_REFRESH_MILLIS: ${KOD_MARKET_PRICE_REFRESH_MILLIS:-5000}
      KOD_MARKET_PRICE_HISTORY_SAMPLE_MILLIS: ${KOD_MARKET_PRICE_HISTORY_SAMPLE_MILLIS:-60000}
      KOD_MARKET_PRICE_HISTORY_RETENTION_DAYS: ${KOD_MARKET_PRICE_HISTORY_RETENTION_DAYS:-30}
      # 游客官网蒜宝（固定服务端上游）
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_ALLOWED_HOSTS: ${ASSISTANT_ALLOWED_HOSTS:-}
      ASSISTANT_CONNECT_TIMEOUT: ${ASSISTANT_CONNECT_TIMEOUT:-10s}
      ASSISTANT_STREAM_TIMEOUT: ${ASSISTANT_STREAM_TIMEOUT:-45s}
      ASSISTANT_MAX_INPUT_CHARS: ${ASSISTANT_MAX_INPUT_CHARS:-500}
      ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-1000}
      ASSISTANT_MAX_MESSAGES: ${ASSISTANT_MAX_MESSAGES:-8}
      ASSISTANT_MAX_CONTEXT_CHARS: ${ASSISTANT_MAX_CONTEXT_CHARS:-4000}
      ASSISTANT_MAX_PER_MINUTE_PER_IP: ${ASSISTANT_MAX_PER_MINUTE_PER_IP:-10}
      ASSISTANT_MAX_DAILY_PER_IP: ${ASSISTANT_MAX_DAILY_PER_IP:-80}
      ASSISTANT_MAX_DAILY_PER_DEVICE: ${ASSISTANT_MAX_DAILY_PER_DEVICE:-50}
      ASSISTANT_MAX_CONCURRENT_PER_DEVICE: ${ASSISTANT_MAX_CONCURRENT_PER_DEVICE:-1}
      # 邮件（SMTP 验证码）
      MAIL_HOST: ${MAIL_HOST:-smtp.zoho.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # 实名材料、设备凭证与商品图片均为加密文件，必须跨容器重建持久保存。
      - ${KOD_COMPUTE_PRIVATE_STORAGE_HOST:-./data/compute-private}:/var/lib/kod/compute-private
      - ${KOD_APPLE_ROOT_CERTIFICATES_HOST:-./secrets/apple}:/run/secrets/apple:ro
    networks:
      - kod-net

  # 前端 Nginx（托管静态资源 + 反代 /api → backend）
  frontend:
    build: ./frontend
    image: kod-frontend:latest
    container_name: kod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - kod-net

networks:
  kod-net:
    driver: bridge
