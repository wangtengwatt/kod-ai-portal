name: kod-ai-portal

# 仅部署前端 + 后端两个容器；MySQL / Redis 使用已有的外部实例（通过 .env 配置）。

services:
  # 后端 Spring Boot
  backend:
    build: ./backend
    image: kod-backend:latest
    container_name: kod-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 外部已有的 MySQL
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kod}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 外部已有的 Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # 游客官网蒜宝（固定服务端上游）
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_ALLOWED_HOSTS: ${ASSISTANT_ALLOWED_HOSTS:-}
      ASSISTANT_CONNECT_TIMEOUT: ${ASSISTANT_CONNECT_TIMEOUT:-10s}
      ASSISTANT_STREAM_TIMEOUT: ${ASSISTANT_STREAM_TIMEOUT:-45s}
      ASSISTANT_MAX_INPUT_CHARS: ${ASSISTANT_MAX_INPUT_CHARS:-500}
      ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-1000}
      ASSISTANT_MAX_MESSAGES: ${ASSISTANT_MAX_MESSAGES:-8}
      ASSISTANT_MAX_CONTEXT_CHARS: ${ASSISTANT_MAX_CONTEXT_CHARS:-4000}
      ASSISTANT_MAX_PER_MINUTE_PER_IP: ${ASSISTANT_MAX_PER_MINUTE_PER_IP:-10}
      ASSISTANT_MAX_DAILY_PER_IP: ${ASSISTANT_MAX_DAILY_PER_IP:-80}
      ASSISTANT_MAX_DAILY_PER_DEVICE: ${ASSISTANT_MAX_DAILY_PER_DEVICE:-50}
      ASSISTANT_MAX_CONCURRENT_PER_DEVICE: ${ASSISTANT_MAX_CONCURRENT_PER_DEVICE:-1}
      # 邮件（SMTP 验证码）
      MAIL_HOST: ${MAIL_HOST:-smtp.zoho.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - kod-net

  # 前端 Nginx（托管静态资源 + 反代 /api → backend）
  frontend:
    build: ./frontend
    image: kod-frontend:latest
    container_name: kod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - kod-net

networks:
  kod-net:
    driver: bridge
