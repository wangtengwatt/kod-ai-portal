<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蒜宝桌面宠物 - 碰边探头</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f0f0f3;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }

  /* 手机框：overflow:hidden 是关键，溢出的蒜宝身体会被自然裁掉 */
  .phone-frame {
    width: 360px;
    height: 640px;
    border-radius: 32px;
    border: 8px solid #2c2c2a;
    background: linear-gradient(180deg, #f5f5f7 0%, #e8e8ed 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    touch-action: none;
  }
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #666;
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid #eee;
    z-index: 100;
    user-select: none;
  }
  .state-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 8px;
    transition: all 0.3s;
  }

  /* 蒜宝容器：可以溢出屏幕，位置用 left/top 控制 */
  .suanbao-root {
    position: absolute;
    width: 80px;
    height: 96px;
    cursor: grab;
    touch-action: none;
    user-select: none;
    will-change: left, top, transform;
    z-index: 50;
    transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .suanbao-root:active { cursor: grabbing; }
  .suanbao-root.dragging { transition: none; }
  /* 探头时移除位置过渡，让弹入墙体是即时的，弹出用动画 */
  .suanbao-root.edge {
    transition: left 0.25s ease-out, top 0.25s ease-out;
  }
  .suanbao-root.dragging.edge { transition: none; }

  .suanbao-mascot {
    position: relative;
    width: 64px;
    height: 76px;
    margin: 0 auto;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 6px 10px rgba(46, 62, 38, 0.22));
    will-change: transform, filter;
    animation: suanbao-float 2.6s ease-in-out infinite;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
  }
  .suanbao-root.edge .suanbao-mascot { animation: none; }

  .suanbao-mascot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .suanbao-name {
    font-size: 10px;
    font-weight: 700;
    color: #555;
    background: #fff;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid #ddd;
    margin: 2px auto 0;
    width: fit-content;
    white-space: nowrap;
    transition: opacity 0.2s;
  }

  .thinking-dots {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    z-index: 3;
  }
  .thinking-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #6f5ee7;
    opacity: 0.8;
    animation: thinking-bounce 1.2s ease-in-out infinite;
  }
  .thinking-dot:nth-child(1) { animation-delay: 0s; }
  .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

  .state-thinking { filter: drop-shadow(0 6px 10px rgba(46,62,38,0.2)) drop-shadow(0 0 6px rgba(111,94,231,0.65)); }
  .state-success  { filter: drop-shadow(0 6px 10px rgba(46,62,38,0.2)) drop-shadow(0 0 6px rgba(72,177,104,0.7)); }
  .state-sad      { filter: drop-shadow(0 6px 10px rgba(46,62,38,0.2)) drop-shadow(0 0 6px rgba(96,165,250,0.65)); animation: suanbao-sad 3s ease-in-out infinite; }

  /* 探头动画：身体藏墙后，头部周期性探出-缩回-左右歪头，俏皮偷看 */
  @keyframes peek-look {
    0%   { transform: translateY(10px) rotate(-6deg) scale(1); }
    12%  { transform: translateY(-3px) rotate(0deg) scale(1.06); }
    25%  { transform: translateY(-1px) rotate(7deg) scale(1.04); }
    40%  { transform: translateY(-5px) rotate(0deg) scale(1.07); }
    55%  { transform: translateY(4px) rotate(-5deg) scale(1); }
    70%  { transform: translateY(-2px) rotate(5deg) scale(1.05); }
    85%  { transform: translateY(2px) rotate(-2deg) scale(1.02); }
    100% { transform: translateY(10px) rotate(-6deg) scale(1); }
  }
  .peeking-anim { animation: peek-look 2.8s ease-in-out infinite !important; }

  /* 收起：缩一下躲进去 */
  @keyframes hide-shrink {
    0%   { transform: scale(1) rotate(0deg); }
    100% { transform: scale(0.82) rotate(3deg); }
  }
  .hiding-anim { animation: hide-shrink 0.28s ease-out forwards !important; }

  @keyframes suanbao-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes suanbao-sad {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(3px) rotate(-2deg); }
  }
  @keyframes thinking-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  .controls {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 400px;
  }
  .btn {
    padding: 8px 18px;
    border: 1.5px solid #ddd;
    border-radius: 20px;
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    color: #555;
  }
  .btn:hover { border-color: #97C459; color: #3B6D11; }
  .btn.active {
    background: #97C459;
    color: #fff;
    border-color: #3B6D11;
  }
  .btn-recall {
    border-color: #534AB7 !important;
    color: #534AB7 !important;
    background: #fff !important;
  }

  .drag-hint {
    margin-top: 8px;
    font-size: 13px;
    color: #534AB7;
    font-weight: 500;
  }

  .legend {
    margin-top: 16px;
    font-size: 12px;
    color: #999;
    text-align: center;
    max-width: 360px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <h1>蒜宝桌面宠物预览</h1>
  <p class="subtitle">碰到屏幕边身体藏墙后，只露脑袋左右张望俏皮偷看</p>

  <div class="phone-frame" id="phone">
    <div class="status-bar">
      当前状态：<span class="state-badge" id="stateBadge" style="background:#e8f5e0;color:#3B6D11">IDLE</span>
      <span style="margin-left:12px;color:#aaa" id="edgeHint"></span>
    </div>

    <div class="suanbao-root" id="suanbao">
      <div class="suanbao-mascot" id="mascot">
        <div class="thinking-dots" id="thinkingDots" style="display:none">
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
        </div>
        <img id="mascotImg" src="suanbao-mascot.png" alt="蒜宝" draggable="false">
      </div>
      <div class="suanbao-name" id="suanbaoName">蒜宝</div>
    </div>
  </div>

  <div class="drag-hint">按住蒜宝往屏幕边拖 · 碰到边先收起再探头</div>

  <div class="controls">
    <button class="btn active" data-state="IDLE">待机 IDLE</button>
    <button class="btn" data-state="THINKING">思考 THINKING</button>
    <button class="btn" data-state="SUCCESS">成功 SUCCESS</button>
    <button class="btn" data-state="SAD">难过 SAD</button>
    <button class="btn btn-recall" id="recallBtn">召回蒜宝</button>
    <button class="btn btn-recall" id="hideBtn" style="border-color:#e74c3c;color:#e74c3c">收起蒜宝</button>
  </div>

  <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="taskSuccessBtn" style="border-color:#97C459;color:#3B6D11;font-weight:600">▶ 执行任务（成功）</button>
    <button class="btn" id="taskFailBtn" style="border-color:#e74c3c;color:#e74c3c;font-weight:600">▶ 执行任务（失败）</button>
    <button class="btn" id="taskStopBtn" style="border-color:#888;color:#888">■ 停止任务</button>
  </div>

  <div class="legend">
    蒜宝状态自动跟随任务流程：<b>待机</b> → 发起任务变<b>思考</b> → 完成变<b>成功</b> / 失败变<b>难过</b> → 2秒后自动回待机。
    也可拖蒜宝到屏幕边，身体藏墙后只留脑袋探头偷看。
  </div>

<script>
const phone = document.getElementById('phone');
const suanbao = document.getElementById('suanbao');
const mascot = document.getElementById('mascot');
const mascotImg = document.getElementById('mascotImg');
const thinkingDots = document.getElementById('thinkingDots');
const suanbaoName = document.getElementById('suanbaoName');

let businessState = 'IDLE';
let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;
let posX = 0;
let posY = 0;
let isReturning = false;
let currentEdge = null;     // 当前贴着哪条边: 'left'/'right'/'top'/'bottom'/null
let peekTimeout = null;
let edgeAnimStage = 'none'; // 'none' | 'hiding' | 'peeking'

const MASCOT_W = 80;
const MASCOT_H = 96;
const STATUS_BAR_H = 36;  // 顶部状态栏高度，上边探头要露在它下方
// 触碰阈值
const TOUCH_THRESHOLD = 25;

function getPhoneSize() {
  // 用 clientWidth/clientHeight（content-box，不含 border），避免 border 导致右边/下边偏差
  return { w: phone.clientWidth, h: phone.clientHeight };
}

function centerSuanbao() {
  const { w, h } = getPhoneSize();
  posX = (w - MASCOT_W) / 2;
  posY = (h - MASCOT_H) / 2;
  applyPos();
}

function applyPos() {
  suanbao.style.left = posX + 'px';
  suanbao.style.top = posY + 'px';
}

// 计算蒜宝边框到屏幕各边的距离（可为负，表示已溢出）
function getEdgeDistances() {
  const { w, h } = getPhoneSize();
  return {
    left: posX,
    right: w - posX - MASCOT_W,
    top: posY,
    bottom: h - posY - MASCOT_H,
  };
}

// 检测当前碰到了哪条边（蒜宝边框距屏幕边 < 阈值）
function getTouchedEdge() {
  const d = getEdgeDistances();
  // 上边要减去状态栏高度，蒜宝贴状态栏下方才算碰到"上边"
  const topDist = d.top - STATUS_BAR_H;
  const edges = [
    { name: 'left',   dist: d.left },
    { name: 'right',  dist: d.right },
    { name: 'top',    dist: topDist },
    { name: 'bottom', dist: d.bottom },
  ];
  // 只要有边距 < 阈值，就算碰到
  const touched = edges.filter(e => e.dist < TOUCH_THRESHOLD);
  if (touched.length === 0) return null;
  // 取最贴边的那条
  touched.sort((a, b) => a.dist - b.dist);
  return touched[0].name;
}

function updateMascot() {
  const touched = getTouchedEdge();
  const wasAtEdge = (currentEdge !== null);
  currentEdge = touched;

  // 业务状态样式（拖拽中不碰边缘动画）
  mascot.className = 'suanbao-mascot';
  thinkingDots.style.display = (businessState === 'THINKING' && !currentEdge) ? 'flex' : 'none';
  mascotImg.src = (businessState === 'THINKING' && !currentEdge) ? 'suanbao-thinking.png' : 'suanbao-mascot.png';

  if (!currentEdge) {
    // 不在边缘：恢复业务状态
    if (wasAtEdge) clearEdgeState();
    switch (businessState) {
      case 'THINKING': mascot.classList.add('state-thinking'); break;
      case 'SUCCESS':  mascot.classList.add('state-success'); break;
      case 'SAD':       mascot.classList.add('state-sad'); break;
    }
    suanbaoName.style.opacity = '1';
    suanbao.classList.remove('edge');
    updateLabels(businessState);
  } else if (!isDragging) {
    // 在边缘且没在拖拽：松手后才触发收起→探头
    if (!wasAtEdge || edgeAnimStage === 'none') {
      triggerEdgeReaction(currentEdge);
    }
  } else {
    // 拖拽中且在边缘：显示"即将探头"的提示
    updateLabels('HIDING');
    suanbaoName.style.opacity = '0';
  }
}

// 碰到边缘的反应：收起 → 探头
function triggerEdgeReaction(edge) {
  clearTimeout(peekTimeout);
  suanbao.classList.add('edge');
  suanbaoName.style.opacity = '0';

  // 第一阶段：收起——把蒜宝往边外推一点（身体藏进墙），同时缩小
  edgeAnimStage = 'hiding';
  pushToEdge(edge, 'hiding');
  mascot.className = 'suanbao-mascot hiding-anim';
  mascot.style.filter = 'drop-shadow(0 2px 4px rgba(46,62,38,0.15))';
  updateLabels('HIDING');

  // 第二阶段：0.3s 后探头——弹出来一点，半个身子留在墙外，半个头探出来
  peekTimeout = setTimeout(() => {
    edgeAnimStage = 'peeking';
    pushToEdge(edge, 'peeking');
    mascot.className = 'suanbao-mascot peeking-anim';
    mascot.style.filter = 'drop-shadow(0 4px 8px rgba(46,62,38,0.2))';
    updateLabels('PEEKING');
  }, 300);
}

// 把蒜宝推到边缘外侧：身体藏墙后，只留头部
function pushToEdge(edge, stage) {
  const { w, h } = getPhoneSize();

  if (isDragging) {
    // 拖拽中不强行改位置，让用户控制
    return;
  }

  // 留头部的量：露出来的部分（头部大小）
  // 头部约占蒜宝上 1/3，所以纵向留 38px，横向留 55px（露大半张脸）
  const headH = 38;
  const headW = 55;

  if (edge === 'left' || edge === 'right') {
    // 左右贴边：身体横向藏一半，露内侧半边脸
    const ox = stage === 'hiding' ? MASCOT_W - 25 : MASCOT_W - headW;
    if (edge === 'left')  posX = -ox;
    else                  posX = w - MASCOT_W + ox;
    // 纵向居中（避开状态栏）
    posY = (h - MASCOT_H) / 2;
  } else if (edge === 'top') {
    // 上贴边：身体藏在状态栏后，只留脑袋
    // 蒜宝上沿在 -(MASCOT_H - headH)，但还要避开状态栏，所以位置 = STATUS_BAR_H - headH
    const oy = stage === 'hiding' ? MASCOT_H - 18 : MASCOT_H - headH;
    posY = STATUS_BAR_H - oy;  // 让头部刚好露在状态栏下方
    posX = (w - MASCOT_W) / 2;
  } else {  // bottom
    const oy = stage === 'hiding' ? MASCOT_H - 18 : MASCOT_H - headH;
    posY = h - MASCOT_H + oy;
    posX = (w - MASCOT_W) / 2;
  }
  applyPos();
}

function clearEdgeState() {
  clearTimeout(peekTimeout);
  edgeAnimStage = 'none';
  suanbao.classList.remove('edge');
  suanbao.style.transform = '';
  mascot.style.transform = '';
  mascot.style.filter = '';
  mascot.className = 'suanbao-mascot';
}

function updateLabels(state) {
  const badge = document.getElementById('stateBadge');
  const edgeHint = document.getElementById('edgeHint');
  const colors = {
    IDLE:      ['#e8f5e0','#3B6D11'],
    THINKING:  ['#EEEDFE','#534AB7'],
    SUCCESS:   ['#E1F5EE','#0F6E56'],
    SAD:       ['#E6F1FB','#0C447C'],
    PEEKING:   ['#FAEEDA','#854F0B'],
    HIDING:    ['#F1EFE8','#5F5E5A'],
    HIDDEN:    ['#F0F0F0','#999'],
  };
  const [bg, fg] = colors[state] || colors.IDLE;
  badge.textContent = state;
  badge.style.background = bg;
  badge.style.color = fg;
  if (state === 'PEEKING') edgeHint.textContent = '← 探头偷看';
  else if (state === 'HIDING') edgeHint.textContent = '← 收起中';
  else edgeHint.textContent = '';
}

// 拖拽
function getEventPos(e) {
  const rect = phone.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches[0]) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function onDown(e) {
  const pos = getEventPos(e);
  // 命中检测：点在蒜宝范围内（含溢出部分，留 10px 余量方便点）
  if (pos.x >= posX - 10 && pos.x <= posX + MASCOT_W + 10 &&
      pos.y >= posY - 10 && pos.y <= posY + MASCOT_H + 10) {
    isDragging = true;
    isReturning = false;
    suanbao.classList.add('dragging');
    dragOffsetX = pos.x - posX;
    dragOffsetY = pos.y - posY;
    // 拖拽开始时清除边缘动画态，让用户自由拖
    clearEdgeState();
    currentEdge = null;
    e.preventDefault();
  }
}

function onMove(e) {
  if (!isDragging) return;
  const pos = getEventPos(e);
  const { w, h } = getPhoneSize();

  // 允许溢出屏幕边缘，但限制最大溢出量（至少留 18px 能点回）
  const minX = -(MASCOT_W - 18);
  const maxX = w - 18;
  const minY = -(MASCOT_H - 18);
  const maxY = h - 18;
  posX = Math.max(minX, Math.min(maxX, pos.x - dragOffsetX));
  posY = Math.max(minY, Math.min(maxY, pos.y - dragOffsetY));
  applyPos();
  updateMascot();
  e.preventDefault();
}

function onUp() {
  if (!isDragging) return;
  isDragging = false;
  suanbao.classList.remove('dragging');
  // 松手后重新检测边缘状态——如果在边缘，触发探头动画
  updateMascot();
}

function returnToCenter() {
  isReturning = true;
  clearEdgeState();
}

function returnAnim() {
  if (isReturning && !isDragging) {
    const { w, h } = getPhoneSize();
    const targetX = (w - MASCOT_W) / 2;
    const targetY = (h - MASCOT_H) / 2;
    posX += (targetX - posX) * 0.15;
    posY += (targetY - posY) * 0.15;
    if (Math.abs(posX - targetX) < 0.5 && Math.abs(posY - targetY) < 0.5) {
      posX = targetX;
      posY = targetY;
      isReturning = false;
    }
    applyPos();
    updateMascot();
  }
  requestAnimationFrame(returnAnim);
}

suanbao.addEventListener('mousedown', onDown);
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup', onUp);
suanbao.addEventListener('touchstart', onDown, { passive: false });
document.addEventListener('touchmove', onMove, { passive: false });
document.addEventListener('touchend', onUp);

let lastTapTime = 0;
suanbao.addEventListener('dblclick', returnToCenter);
suanbao.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTapTime < 300) returnToCenter();
  lastTapTime = now;
});

document.getElementById('recallBtn').addEventListener('click', returnToCenter);

// 收起/显示蒜宝
let isHidden = false;
const hideBtn = document.getElementById('hideBtn');
function hideSuanbao() {
  if (isHidden) {
    // 显示回来
    isHidden = false;
    suanbao.style.display = '';
    hideBtn.textContent = '收起蒜宝';
  } else {
    // 收起：先缩一下再隐藏
    isHidden = true;
    isDragging = false;
    clearEdgeState();
    mascot.style.transition = 'transform 0.3s ease-in, opacity 0.3s ease-in';
    mascot.style.transform = 'scale(0)';
    mascot.style.opacity = '0';
    setTimeout(() => {
      if (isHidden) {
        suanbao.style.display = 'none';
        mascot.style.transition = '';
        mascot.style.transform = '';
        mascot.style.opacity = '';
      }
    }, 300);
    hideBtn.textContent = '显示蒜宝';
    updateLabels('HIDDEN');
  }
}
hideBtn.addEventListener('click', hideSuanbao);

// ===== 任务状态自动驱动蒜宝 =====
// 调用方式：setBusinessState('THINKING') 等，自动更新 UI
function setBusinessState(state) {
  businessState = state;
  // 同步按钮高亮
  document.querySelectorAll('.btn[data-state]').forEach(b => {
    b.classList.toggle('active', b.dataset.state === state);
  });
  // 如果在边缘探头中，先召回中央再显示新状态
  if (currentEdge) {
    clearEdgeState();
    currentEdge = null;
  }
  updateMascot();
}

let taskTimer = null;
let autoReturnTimer = null;

function startTask(willSucceed) {
  if (isHidden) hideSuanbao();  // 收起状态下自动显示
  clearTimeout(taskTimer);
  clearTimeout(autoReturnTimer);
  // 1. 发起任务 → 思考
  setBusinessState('THINKING');
  // 2. 模拟任务执行 2.5 秒后 → 成功/失败
  taskTimer = setTimeout(() => {
    setBusinessState(willSucceed ? 'SUCCESS' : 'SAD');
    // 3. 2 秒后自动回待机
    autoReturnTimer = setTimeout(() => {
      setBusinessState('IDLE');
    }, 2000);
  }, 2500);
}

function stopTask() {
  clearTimeout(taskTimer);
  clearTimeout(autoReturnTimer);
  setBusinessState('IDLE');
}

document.getElementById('taskSuccessBtn').addEventListener('click', () => startTask(true));
document.getElementById('taskFailBtn').addEventListener('click', () => startTask(false));
document.getElementById('taskStopBtn').addEventListener('click', stopTask);

document.querySelectorAll('.btn[data-state]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-state]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    businessState = btn.dataset.state;
    updateMascot();
  });
});

window.addEventListener('load', () => {
  centerSuanbao();
  updateMascot();
  returnAnim();
});

window.addEventListener('resize', () => {
  if (!isDragging) centerSuanbao();
});
</script>
</body>
</html>
